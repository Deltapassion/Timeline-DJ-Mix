# Fabrique les versions Windows, macOS (Apple Silicon et Intel) et Linux.
# - à chaque envoi sur main : les fichiers sont disponibles dans l'onglet Actions (« Artifacts »)
# - à chaque étiquette v* (ex. v0.3.0) : une « Release » GitHub est créée avec tous les fichiers
name: Fabriquer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabriquer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nom: linux
            commande: npm run dist:linux
          - os: windows-latest
            nom: windows
            commande: npm run dist:win
          - os: macos-latest        # les deux Mac : Apple Silicon (M1, M2…) et Intel
            nom: mac
            commande: npm run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Fabriquer
        run: ${{ matrix.commande }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Version sans installation et notice (une seule fois)
        if: matrix.nom == 'linux'
        run: cp dist-web/Timeline-DJ-Mix.html dist-web/Notice-Timeline-DJ-Mix.html dist/
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-dj-mix-${{ matrix.nom }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.html
          if-no-files-found: error

  publier:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: fabriquer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: TIMELINE DJ MIX ${{ github.ref_name }}
          files: fichiers/*
          generate_release_notes: true
